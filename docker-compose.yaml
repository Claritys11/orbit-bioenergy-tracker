services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command:
      - sh
      - -c
      - "npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed"
    restart: "no"

  orbit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DATABASE_URL: ${DATABASE_URL}
        AUTH_SECRET: ${AUTH_SECRET}
        AUTH_URL: ${AUTH_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      NODE_ENV: production
      PORT: 3115
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3115"
    ports:
      - "3115:3115"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3115/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
